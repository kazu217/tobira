<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Tobira</title>
  <meta name="description" content="Tobiraへのお問い合わせ。相談・見積もりは無料です。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#f4f7f5;--bg2:#ffffff;--bg3:#f8fbf9;--border:#d9e1dd;--text:#16211f;--muted:#63706c;--muted2:#4f5d59;--accent:#176b5b;--accent2:#c7763d;--white:#16211f;--shadow:0 16px 40px rgba(20,43,38,.1);--mono:'Inter',sans-serif;--sans:'Noto Sans JP','Inter',sans-serif; }
    html { scroll-behavior: smooth; }
    body { background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;line-height:1.7;-webkit-font-smoothing:antialiased; }
    .grain { display:none; }
    @keyframes grain { 0%{transform:translate(0,0)}10%{transform:translate(-3%,-8%)}25%{transform:translate(-12%,5%)}37%{transform:translate(6%,-20%)}50%{transform:translate(-4%,20%)}62%{transform:translate(-12%,8%)}75%{transform:translate(12%,-2%)}87%{transform:translate(2%,14%)} }
    .cursor { display:none; }
    .cursor-ring { display:none; }
    .cursor.grow { width:14px;height:14px; } .cursor-ring.grow { width:58px;height:58px;border-color:rgba(201,169,110,0.35); }
    @media (max-width:768px) { .cursor,.cursor-ring { display:none; } }
    nav { position:sticky;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;min-height:68px;padding:.85rem clamp(1rem,4vw,3rem);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border); }
    nav.scrolled { background:rgba(255,255,255,.96);border-color:var(--border); }
    .nav-logo { font-family:var(--sans);font-size:1.1rem;font-weight:800;letter-spacing:0;color:var(--text);text-decoration:none; }
    .nav-logo span { font-size:.66rem;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-left:.45rem;text-transform:none;vertical-align:middle; }
    .nav-links { display:flex;gap:.35rem;list-style:none;flex-wrap:wrap; }
    .nav-links a { display:inline-flex;min-height:36px;align-items:center;border-radius:8px;padding:.45rem .65rem;font-size:.85rem;letter-spacing:0;color:var(--muted);text-decoration:none;text-transform:none;transition:background .2s,color .2s; }
    .nav-links a:hover,.nav-links a.active { background:#e8f0ed;color:var(--accent); }
    @media (max-width:768px) { nav { align-items:flex-start;flex-direction:column;padding:1rem 1.25rem; } .nav-links { gap:.2rem; } }
    section { max-width:1180px;margin:0 auto;padding:clamp(2.5rem,5vw,4rem) clamp(1rem,4vw,3rem); }
    .section-label { font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);margin-bottom:.6rem;font-weight:800; }
    .section-title { font-size:clamp(2.1rem,6vw,4.2rem);font-weight:800;color:var(--text);letter-spacing:0;margin-bottom:1.4rem;line-height:1.05; }
    .fade-in,.fade-in.visible { opacity:1;transform:none; }
    .contact-wrap { max-width:720px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:clamp(1.2rem,3vw,2rem);box-shadow:var(--shadow); }
    .contact-lead { font-size:.98rem;color:var(--muted);line-height:1.9;margin-bottom:2rem; }
    .form-row { margin-bottom:1.4rem; }
    .form-row label { display:block;font-family:var(--sans);font-size:.88rem;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:800;margin-bottom:.45rem; }
    .form-row input,.form-row select,.form-row textarea { width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:1rem;font-weight:400;padding:.78rem .85rem;outline:none;transition:border-color .25s,box-shadow .25s;-webkit-appearance:none; }
    .form-row input:focus,.form-row select:focus,.form-row textarea:focus { border-color:rgba(23,107,91,.45);box-shadow:0 0 0 3px rgba(23,107,91,.1); }
    .form-row textarea { min-height:120px;resize:vertical; }
    .form-row select option { background:#fff; }
    .form-two { display:grid;grid-template-columns:1fr 1fr;gap:1.1rem; }
    .submit-btn { display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:44px;border-radius:8px;padding:.75rem 1rem;background:var(--accent);color:#fff;font-family:var(--sans);font-size:1rem;font-weight:800;letter-spacing:0;text-transform:none;border:none;cursor:pointer;transition:background .25s,color .25s,transform .2s;margin-top:.5rem; }
    .submit-btn:hover { background:#0f4a3f;color:#fff;transform:translateY(-2px); }
    @media (max-width:768px) { .form-two { grid-template-columns:1fr; } section { padding:2rem 1.25rem 4rem; } }
    footer { padding:2.2rem 3rem 1.2rem;border-top:1px solid var(--border);background:rgba(255,255,255,.55); }
    .footer-main { display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.4rem; }
    .footer-brand { font-family:var(--mono);font-size:.88rem;font-weight:700;color:var(--text); }
    .footer-links { display:flex;gap:1.7rem;align-items:center; }
    .footer-links a { font-family:var(--mono);font-size:.65rem;letter-spacing:.11em;color:var(--muted);text-decoration:none;transition:color .2s; }
    .footer-links a:hover { color:var(--accent); }
    .footer-copy { font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:.5rem; }
    @media (max-width:768px) { footer { padding:2rem 1.5rem 1rem; } .footer-main { flex-direction:column;align-items:flex-start; } }
  </style>
  <link rel="stylesheet" href="/tobira-theme.css">
</head>
<body>
<div class="grain"></div>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<nav id="nav">
  <a class="nav-logo" href="/">Tobira<span>Web Design</span></a>
  <ul class="nav-links">
    <li><a href="about.html">About</a></li>
    <li><a href="services/index.html">Services</a></li>
    <li><a href="works.html">Works</a></li>
    <li><a href="process.html">Process</a></li>
    <li><a href="faq.html">FAQ</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>
<section>
  <div class="fade-in">
    <p class="section-label">Contact</p>
    <h2 class="section-title">お問い合わせ</h2>
  </div>
  <div class="contact-wrap fade-in">
    <p class="contact-lead">
      まずは無料相談から。<br>
      「ウェブサイトをどうすれば良いかわからない」というご相談も大歓迎です。<br>
      他社見積もりがある場合は、内容を見たうえで価格調整も検討します。<br>
      通常2営業日以内にご返信します。
    </p>
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="effabb99-c5a7-44bb-aa2b-d1ef49447573">
      <input type="hidden" name="subject" value="新しいお問い合わせ — Tobira">
      <input type="hidden" name="from_name" value="Tobira お問い合わせフォーム">
      <div class="form-two">
        <div class="form-row"><label>お名前 *</label><input type="text" name="name" required placeholder="田中 太郎"></div>
        <div class="form-row"><label>業種</label><input type="text" name="industry" placeholder="例：美容院"></div>
      </div>
      <div class="form-row"><label>メールアドレス *</label><input type="email" name="email" required placeholder="example@email.com"></div>
      <div class="form-row">
        <label>ご相談内容</label>
        <select name="service">
          <option value="">選択してください</option>
          <option>ランディングページを作りたい</option>
          <option>コーポレートサイトを作りたい</option>
          <option>かんたん予約ページを作りたい</option>
          <option>今のサイトをリニューアルしたい</option>
          <option>セキュリティ診断をしたい</option>
          <option>業務を自動化したい（DX化）</option>
          <option>まずは相談だけしたい</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-row"><label>メッセージ</label><textarea name="message" placeholder="ご要望・ご質問などをお気軽にどうぞ"></textarea></div>
      <button type="submit" class="submit-btn">
        送信する
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>
</section>
<footer>
  <div class="footer-main">
    <div class="footer-brand">Tobira</div>
    <div class="footer-links">
      <a href="mailto:tobira.webdesign@gmail.com">Email</a>
      <a href="contact.html">Contact</a>
      <a href="/privacy.html">プライバシーポリシー</a>
    </div>
  </div>
  <div class="footer-copy">© 2026 Tobira</div>
</footer>
<script>
  const nav=document.getElementById('nav');
  window.addEventListener('scroll',()=>{ nav.classList.toggle('scrolled',window.scrollY>40); });
  const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
  document.querySelectorAll('.fade-in').forEach(el=>io.observe(el));
  const cursor=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
  if(cursor&&ring){let mx=0,my=0,rx=0,ry=0;document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});(function loop(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;cursor.style.left=mx+'px';cursor.style.top=my+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>{cursor.classList.add('grow');ring.classList.add('grow');});el.addEventListener('mouseleave',()=>{cursor.classList.remove('grow');ring.classList.remove('grow');});});document.addEventListener('mouseleave',()=>{cursor.style.opacity='0';ring.style.opacity='0';});document.addEventListener('mouseenter',()=>{cursor.style.opacity='1';ring.style.opacity='1';});}
</script>
</body>
</html>
